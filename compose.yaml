services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: servicetones
      POSTGRES_USER: servicetones
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [servicetones-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicetones -d servicetones"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  servicetones-postgres:
