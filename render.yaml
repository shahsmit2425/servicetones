# One shared environment group per environment, linked to every application service.
# Enter DATABASE_URL and provider credentials manually in each group.
services:
  - type: web
    name: servicetones-development-api
    runtime: node
    plan: starter
    region: ohio
    repo: https://github.com/shahsmit2425/servicetones
    branch: development
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev
    startCommand: npm run start:api
    preDeployCommand: npm run config:check && npm run db:migrate
    healthCheckPath: /api/health
    envVars:
      - fromGroup: servicetones-development
  - type: worker
    name: servicetones-development-mail
    runtime: node
    plan: starter
    region: ohio
    repo: https://github.com/shahsmit2425/servicetones
    branch: development
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev
    startCommand: npm run worker
    envVars:
      - fromGroup: servicetones-development
  - type: web
    name: servicetones-development-web
    runtime: node
    plan: starter
    region: ohio
    repo: https://github.com/shahsmit2425/servicetones
    branch: development
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build:web
    startCommand: npm run start:web
    healthCheckPath: /health
    envVars:
      - fromGroup: servicetones-development
  - type: web
    name: servicetones-development-admin
    runtime: static
    repo: https://github.com/shahsmit2425/servicetones
    branch: development
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build:admin
    staticPublishPath: dist/admin
    envVars:
      - fromGroup: servicetones-development
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /index.html
        name: Cache-Control
        value: no-store
      - path: /release.json
        name: Cache-Control
        value: no-store
      - path: /*
        name: Content-Security-Policy
        value:
          default-src 'self'; script-src 'self'; style-src 'self'; connect-src
          'self' https:; img-src 'self' data:; frame-ancestors 'none'; base-uri
          'none'; object-src 'none'; form-action 'self'
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  - type: web
    name: servicetones-stagging-api
    runtime: node
    plan: starter
    region: ohio
    repo: https://github.com/shahsmit2425/servicetones
    branch: stagging
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev
    startCommand: npm run start:api
    preDeployCommand: npm run config:check && npm run db:migrate
    healthCheckPath: /api/health
