databases:
  - name: servicetones-development-db
    plan: basic-256mb
    region: ohio
    databaseName: servicetones
    user: servicetones
    ipAllowList: []
  - name: servicetones-stagging-db
    plan: basic-256mb
    region: ohio
    databaseName: servicetones
    user: servicetones
    ipAllowList: []
  - name: servicetones-production-db
    plan: basic-256mb
    region: ohio
    databaseName: servicetones
    user: servicetones
    ipAllowList: []
envVarGroups:
  - name: servicetones-development
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: development
      - key: DATABASE_SSL
        value: render-internal
      - key: SMTP_HOST
        value: smtp.office365.com
      - key: SMTP_PORT
        value: "587"
      - key: STRIPE_PLATFORM_FEE_PERCENT
        value: "10"
  - name: servicetones-stagging
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: stagging
      - key: DATABASE_SSL
        value: render-internal
      - key: SMTP_HOST
        value: smtp.office365.com
      - key: SMTP_PORT
        value: "587"
      - key: STRIPE_PLATFORM_FEE_PERCENT
        value: "10"
  - name: servicetones-production
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: DATABASE_SSL
        value: render-internal
      - key: SMTP_HOST
        value: smtp.office365.com
      - key: SMTP_PORT
        value: "587"
      - key: STRIPE_PLATFORM_FEE_PERCENT
        value: "10"
